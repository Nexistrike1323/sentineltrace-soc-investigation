[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentineltrace"
version = "0.2.0"
description = "Evidence-based cross-platform SOC investigation platform"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.20",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
sentineltrace = "sentineltrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
